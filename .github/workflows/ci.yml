# CI for marine_control on the rolling branch. Pushes and pull requests to
# rolling build + test all packages on both Jazzy and Rolling (a distro
# matrix), so the shared code keeps building on Jazzy for backports to the
# jazzy branch. The jazzy branch carries its own Jazzy-only workflow.
# Dependencies (rosidl generators, std_msgs) are pulled by rosdep from each
# package.xml.

name: CI

on:
  push:
    branches: [rolling]
  pull_request:
    branches: [rolling]

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, rolling]
    # The container supplies the distro's OS; the host runner only runs it.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ros:${{ matrix.distro }}-ros-core

    steps:
      - name: Update apt
        run: apt-get update

      - name: Install ros dev tools
        run: DEBIAN_FRONTEND=noninteractive apt-get -y install ros-dev-tools

      - name: Checkout
        uses: actions/checkout@v6

      - name: Init rosdep
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi

      - name: Update rosdep
        run: rosdep update

      - name: Create workspace
        run: mkdir -p ../ws/src && ln -s "$GITHUB_WORKSPACE" ../ws/src/marine_control

      - name: Install ROS dependencies
        working-directory: ../ws
        run: >
          DEBIAN_FRONTEND=noninteractive
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/${{ matrix.distro }}/setup.bash &&
          colcon build --cmake-args -DBUILD_TESTING=ON'

      - name: Test
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/${{ matrix.distro }}/setup.bash &&
          source install/setup.bash &&
          colcon test --event-handlers console_direct+
          --return-code-on-test-failure'

      - name: Test results
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/${{ matrix.distro }}/setup.bash &&
          colcon test-result --verbose'
        if: always()
